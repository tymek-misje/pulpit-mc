<title>Pulpit MC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Układ: jedna kolumna (max 760 px), karty spotkań i bloków planu; scena to osobna, zawsze ciemna nakładka. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eceef2; --line:#dde1e8;
  --ink:#151820; --ink-2:#5b6271; --accent:#a8600c; --accent-ink:#ffffff; --accent-soft:#f8ead8;
  --danger:#b42318; --ok:#1f7a4d; --warn:#9a5b00;
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --r:12px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
  --ink:#eef0f4; --ink-2:#9aa2b1; --accent:#f0a640; --accent-ink:#1a1206; --accent-soft:#2c2314;
  --danger:#ff8a7a; --ok:#5fd39a; --warn:#f0a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
  --ink:#eef0f4; --ink-2:#9aa2b1; --accent:#f0a640; --accent-ink:#1a1206; --accent-soft:#2c2314;
  --danger:#ff8a7a; --ok:#5fd39a; --warn:#f0a640; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:var(--s2);
  padding-block:var(--s3);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding-block:var(--s4) 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--s4)}

.btn{min-height:44px;padding:0 var(--s4);border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:40px;padding:0 var(--s3);font-size:14px}
.btn.danger-ghost{color:var(--danger);background:transparent}
.btn.big{min-height:52px;font-size:17px;width:100%}
.btn:focus-visible,.card:focus-visible,.item-head:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.sync{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:400;text-align:right}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync.s-saved::before{background:var(--ok)}
.sync.s-saving::before{background:var(--accent)}
.sync.s-offline::before,.sync.s-error::before,.sync.s-local::before{background:var(--danger)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface-2);border-radius:var(--r)}
.tab{min-height:48px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.sec{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:var(--s2) 0 0;font-weight:700}
.cards{display:flex;flex-direction:column;gap:var(--s2)}
.card{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);text-align:left;padding:var(--s4);border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%}
.card:hover{border-color:var(--ink-2)}
.card-date{font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.card-title{grid-column:1;font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.card-meta{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:13px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.card-sub{grid-column:1;font-size:14px;color:var(--ink-2)}
.empty{color:var(--ink-2);margin:0;padding:var(--s4);border:1px dashed var(--line);border-radius:var(--r)}

.meta-card{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.title-input{font-family:var(--font-display);font-size:24px;font-weight:700;border:0;background:transparent;padding:4px 0;width:100%;border-bottom:1px solid transparent}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.meta-row{display:flex;gap:var(--s3);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.meta-row>.fld{flex:1 1 120px}
.fld>span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.fld input,.fld textarea,.fld select{min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.fld textarea{resize:none;line-height:1.45;overflow:hidden}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld.w-num{flex:0 0 110px}
.fld.total{flex:0 0 auto}
.fld.total b{min-height:44px;display:flex;align-items:center;font-size:20px;font-variant-numeric:tabular-nums}

.items,.children{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item.k-divider{background:transparent;border-style:dashed}
.children{padding:0 var(--s2) var(--s2) var(--s5)}
.children:empty{display:none}
.children .item{background:var(--bg)}
.item-head{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);width:100%;text-align:left;background:transparent;border:0;padding:var(--s3) var(--s4);min-height:52px;cursor:pointer;border-radius:var(--r)}
.item-title{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.k-block>.item-head .item-title{font-size:18px}
.k-divider>.item-head .item-title{text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--ink-2)}
.item-meta{font-size:14px;color:var(--ink-2);align-self:center;text-align:right;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.item-peek{grid-column:1 / -1;font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:700}
.item.is-hidden>.item-head .item-title{opacity:.5;text-decoration:line-through}
.item.is-open{border-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:var(--s3);padding:0 var(--s4) var(--s4)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2)}
.add-row,.tools,.row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.tools{padding-top:var(--s4);border-top:1px solid var(--line)}

.zjazd{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.zj-head{display:flex;justify-content:space-between;gap:var(--s3);align-items:flex-start}
.zj-title{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0}
.zj-sub{font-size:14px;color:var(--ink-2)}
.zjazd .card{background:var(--bg)}

.trash{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.trash summary{padding:var(--s3) var(--s4);cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.trash-list{list-style:none;margin:0;padding:0 var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.trash-list li{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap;padding-top:var(--s2);border-top:1px solid var(--line)}
.trash-list small{color:var(--ink-2);display:block}

.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding-block:var(--s5) calc(var(--s5) + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--s4)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0}
.sheet p{margin:0;color:var(--ink-2)}
.sheet .row{justify-content:flex-end}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:var(--s3);max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:15px}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.search{min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;font-size:16px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.card-snip{grid-column:1 / -1;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.card-snip mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.arch-item{display:flex;flex-direction:column;gap:6px}
.arch-item .btn{align-self:flex-end}
.banner{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;padding:var(--s2) var(--s3);border-radius:10px;background:var(--accent-soft);font-size:14px}
.item-row{display:flex;align-items:stretch}
.handle{flex:0 0 auto;width:36px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:grab;touch-action:none;font-size:18px;border-radius:var(--r) 0 0 var(--r);-webkit-user-select:none;user-select:none}
.item-row .item-head{padding-left:0;min-width:0}
.item.dragging{box-shadow:0 8px 24px rgba(0,0,0,.25);border-color:var(--accent);position:relative;z-index:3}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.actual{color:var(--ink-2);font-style:italic;font-size:13px}
.gaps{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.tag.gap{background:var(--accent-soft);color:var(--accent)}
.item.is-gap{border-color:var(--accent);border-style:dashed}
.list-tools{display:flex;justify-content:flex-end;margin-bottom:calc(var(--s2) * -1)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.foot-tools{display:flex;justify-content:center;gap:var(--s2);flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div id="stage-root" hidden></div>
<div id="toast" hidden></div>

<script>
/* ---------- Widok sceniczny (samowystarczalny: używany też w pobranym pliku) ---------- */
const STAGE_CSS = `
.st{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column;font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-user-select:none;user-select:none;touch-action:manipulation;color-scheme:dark}
.st *{box-sizing:border-box}
.st-top{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.st-count{font-size:18px;color:#a8aebb;font-variant-numeric:tabular-nums;min-width:52px}
.st-clock{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.st-wake{width:12px;height:12px;border-radius:50%;background:#555;border:0;padding:0;margin-left:4px}
.st-wake.on{background:#3ecf8e}.st-wake.off{background:#f5b14c}
.st-sp{flex:1}
.st-btn{min-width:48px;height:48px;border-radius:12px;border:1px solid #2b2f38;background:#121419;color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.st-exit{position:relative;overflow:hidden;padding:0 14px;font-size:16px}
.st-exit::before{content:"";position:absolute;inset:0;background:rgba(245,177,76,.35);transform:scaleX(0);transform-origin:left;transition:transform .1s}
.st-exit.holding::before{transform:scaleX(1);transition:transform .7s linear}
.st-exit span{position:relative}
.st-prog{height:4px;background:#1c1f26;margin:0 12px;border-radius:2px;overflow:hidden}
.st-prog i{display:block;height:100%;background:#f5b14c;transition:width .2s}
.st-body{flex:1;overflow-y:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.st-eyebrow{font-size:calc(var(--fs) * .6);letter-spacing:.06em;text-transform:uppercase;color:#f5b14c;font-weight:700;margin-bottom:8px;line-height:1.25}
.st-title{font-size:calc(var(--fs) * 1.3);line-height:1.15;margin:0 0 16px;font-weight:700;overflow-wrap:anywhere}
.st-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.st-chip{font-size:calc(var(--fs) * .62);padding:6px 12px;border-radius:999px;background:#1a1d24;color:#e8eaf0;font-variant-numeric:tabular-nums}
.st-chip.lead{background:#f5b14c;color:#1a1206;font-weight:700}
.st-chip.over{background:#5a1d12;color:#ffd2c2}
.st-say{font-size:var(--fs);line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere}
.st-note{margin-top:24px;font-size:calc(var(--fs) * .75);line-height:1.35;color:#ffd59a;border-left:4px solid #f5b14c;padding:6px 0 6px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.st-note b{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#f5b14c;margin-bottom:4px}
.st-empty{font-size:calc(var(--fs) * .7);color:#7d8494}
.st-center{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.st-div .st-title{font-size:calc(var(--fs) * 1.6);color:#f5b14c;text-transform:uppercase;letter-spacing:.04em}
.st-sub{font-size:calc(var(--fs) * .65);color:#a8aebb;line-height:1.4}
.st-nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.st-prev,.st-next{min-height:80px;border-radius:16px;border:1px solid #2b2f38;background:#121419;color:#fff;font:inherit;font-weight:700;cursor:pointer;min-width:0}
.st-prev{font-size:34px}
.st-next{background:#f5b14c;color:#1a1206;border-color:#f5b14c;text-align:left;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:20px}
.st-next small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.st-next span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-prev:disabled,.st-next:disabled{opacity:.3;cursor:default}
.st button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.st-msg{position:absolute;left:12px;right:12px;bottom:calc(110px + env(safe-area-inset-bottom,0px));background:#1a1d24;color:#fff;border:1px solid #2b2f38;border-radius:12px;padding:12px 14px;font-size:16px;text-align:center}
@media (prefers-reduced-motion:reduce){.st-exit.holding::before,.st-prog i{transition:none}}
`;

function mountStage(root, meeting, opts){
  opts = opts || {};
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var num = function(v){ var n = Number(v); return v === '' || v == null || isNaN(n) ? 0 : n; };
  var toClock = function(mins){ var h = Math.floor(mins / 60) % 24, m = Math.round(mins % 60); return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); };
  var startMin = null;
  if (meeting.start && /^\d{1,2}:\d{2}$/.test(meeting.start)) { var p = meeting.start.split(':'); startMin = Number(p[0]) * 60 + Number(p[1]); }

  var slides = [], cursor = 0, total = 0;
  (meeting.items || []).forEach(function(b){
    if (b.hidden) return;
    var kids = (b.children || []).filter(function(c){ return !c.hidden; });
    var bMin = (b.minutes !== null && b.minutes !== '' && b.minutes != null) ? num(b.minutes) : kids.reduce(function(s, c){ return s + num(c.minutes); }, 0);
    var plan = startMin != null ? toClock(startMin + cursor) : '';
    cursor += bMin;
    if (b.kind === 'divider') { slides.push({t:'div', id:b.id, title:b.title, leader:b.leader, minutes:bMin, plan:plan}); return; }
    if (b.say || b.note || !kids.length) slides.push({t:'item', id:b.id, eyebrow:'', title:b.title, leader:b.leader, minutes:bMin, say:b.say, note:b.note, plan:plan});
    kids.forEach(function(c, i){ slides.push({t:'item', id:c.id, blockId:b.id, eyebrow:b.title, title:c.title, leader:c.leader || b.leader, minutes:num(c.minutes), say:c.say, note:c.note, plan: i === 0 && !(b.say || b.note) ? plan : ''}); });
  });
  total = cursor;
  slides.unshift({t:'start'});
  slides.push({t:'end'});

  var fs = 30;
  try { var saved = Number(localStorage.getItem('mc-stage-fs')); if (saved >= 20 && saved <= 60) fs = saved; } catch (e) {}
  var idx = 0;
  if (opts.startId) { for (var q = 0; q < slides.length; q++) { if (slides[q].id === opts.startId || slides[q].blockId === opts.startId) { idx = q; break; } } }
  var slideStart = Date.now(), lock = null, wakeOn = null, msgT = null, holdT = null, tick = null;

  root.innerHTML =
    '<div class="st" style="--fs:' + fs + 'px" role="application" aria-label="Widok sceniczny">' +
      '<div class="st-top">' +
        '<span class="st-count" aria-live="polite"></span>' +
        '<span class="st-clock"></span>' +
        '<button class="st-wake" type="button" aria-label="Stan blokady wygaszania ekranu"></button>' +
        '<span class="st-sp"></span>' +
        '<button class="st-btn" type="button" data-s="smaller" aria-label="Mniejszy tekst">A−</button>' +
        '<button class="st-btn" type="button" data-s="bigger" aria-label="Większy tekst">A+</button>' +
        (opts.standalone ? '' : '<button class="st-btn st-exit" type="button" aria-label="Przytrzymaj, aby wyjść ze sceny"><span>Wyjdź</span></button>') +
      '</div>' +
      '<div class="st-prog"><i></i></div>' +
      '<div class="st-body"></div>' +
      '<div class="st-nav">' +
        '<button class="st-prev" type="button" aria-label="Poprzedni punkt">‹</button>' +
        '<button class="st-next" type="button"><small>Dalej</small><span></span></button>' +
      '</div>' +
    '</div>';

}

function archiveResults(init){

  if (q) {
    const hits = ms.map(m => [m, searchMeeting(m, q)]).filter(x => x[1] !== null).sort((a, b) => (b[0].date || '').localeCompare(a[0].date || ''));
    return hits.length ? hits.map(([m, sn]) => archItem(m, sn)).join('') : `<p class="empty">Nic nie znaleziono dla „${esc(S.q.trim())}”.</p>`;

  if (!past.length) return '<p class="empty">Tu trafią spotkania po swojej dacie.</p>';

function actualSec(m, it){ const a = (m && m.actual) || {}; return (a[it.id] || 0) + (it.children || []).reduce((s, c) => s + (a[c.id] || 0), 0); }
function gapsOf(it, parent){
  if (it.hidden || it.kind === 'divider' || (parent && parent.hidden)) return [];

}

  const d = stageData(m);
  let t = `${d.title}\n${d.initiativeName}${d.date ? ' · ' + d.date.split('-').reverse().join('.') : ''}${d.start ? ' · start ' + d.start : ''}\n${d.mc ? 'MC: ' + d.mc + '\n' : ''}\n`;
  const line = (it, ind) => { let s = ind + it.title + ([it.leader, hasMin(it.minutes) ? it.minutes + ' min' : ''].filter(Boolean).length ? '  [' + [it.leader, hasMin(it.minutes) ? it.minutes + ' min' : ''].filter(Boolean).join(', ') + ']' : '') + '\n';
    if (it.say) s += it.say.split('\n').map(l => ind + '  ' + l).join('\n') + '\n'; if (it.note) s += ind + '  (dla Ciebie: ' + it.note.replace(/\n/g, ' ') + ')\n'; return s; };
  d.items.filter(b => !b.hidden).forEach(b => { t += '\n' + line(b, '').replace(/^/, '■ '); (b.children || []).filter(c => !c.hidden).forEach(c => { t += line(c, '   • '); }); });
  return t;
}
const SCENA_URL = 'https://tymek-misje.github.io/pulpit-mc/scena/';
async function makeStageLink(m){
  const d = stageData(m);
  d.items = clone(d.items).filter(b => !b.hidden).map(b => { b.children = (b.children || []).filter(c => !c.hidden); return b; });
  d.exportedAt = fmtStamp(Date.now());
  const raw = new TextEncoder().encode(JSON.stringify(d));
  const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  let bin = ''; new Uint8Array(buf).forEach(b => { bin += String.fromCharCode(b); });
  return SCENA_URL + '#p=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const fileName = (m, ext) => ('MC ' + (m.date || '') + ' ' + (m.title || 'spotkanie')).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim() + '.' + ext;
async function save(filename, data, okMsg){
  if (!DL) { toast('Pobieranie działa w artefakcie otwartym na claude.ai.'); return; }
  try { await DL.save({ filename, data }); toast(okMsg); }
  catch (e) { const c = e && e.code; if (c === 'declined') return; toast(c === 'rate_limited' ? 'Poczekaj chwilę i spróbuj ponownie.' : 'Nie udało się pobrać pliku.'); }
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'sheet-bg' && e.target !== a) return;
  const li = a.closest('[data-id]'), m = cur();
  const r = li && m ? find(m, li.dataset.id) : null;
  switch (act) {
    case 'tab': S.tab = a.dataset.k; lsSet('mc-tab', S.tab); S.showPast = false; S.q = ''; render(); break;
    case 'open': openMeeting(a.dataset.mid); break;
    case 'home': S.view = 'home'; S.openId = null; render(); window.scrollTo(0, 0); break;
    case 'show-past': S.showPast = true; render(); break;
    case 'new': S.sheet = { type: 'new', init: a.dataset.k, zid: a.closest('[data-zid]') ? a.closest('[data-zid]').dataset.zid : null }; render(); setTimeout(() => { const t = $('#n-title'); if (t && matchMedia('(pointer:fine)').matches) t.focus(); }, 0); break;
    case 'create': createMeeting(); break;
    case 'sheet-close': case 'sheet-bg': S.sheet = null; render(); break;
    case 'new-zjazd': { const n = Object.values(S.zjazdy).filter(z => !z.deletedAt).length + 1; const z = { id: rid(), title: 'Zjazd ' + n, dates: '', team: '', createdAt: Date.now(), deletedAt: null }; S.zjazdy[z.id] = z; persist('zjazdy', z.id); S.expanded.add(z.id); render(); break; }
    case 'zj-edit': { const zid = a.closest('[data-zid]').dataset.zid; S.expanded.has(zid) ? S.expanded.delete(zid) : S.expanded.add(zid); render(); break; }
    case 'del-zjazd': { const z = S.zjazdy[a.closest('[data-zid]').dataset.zid]; z.deletedAt = Date.now(); persist('zjazdy', z.id); render(); toast('Zjazd przeniesiony do kosza.', 'Cofnij', () => { z.deletedAt = null; persist('zjazdy', z.id); render(); }); break; }
    case 'restore': { const row = a.closest('[data-oid]'), o = S[row.dataset.kind][row.dataset.oid]; o.deletedAt = null; persist(row.dataset.kind, o.id); S.confirm = null; render(); toast('Przywrócono.'); break; }
    case 'purge': { const row = a.closest('[data-oid]'), kind = row.dataset.kind, id = row.dataset.oid;
      if (S.confirm !== id) { S.confirm = id; render(); break; }
      S.confirm = null; delete S[kind][id]; persist(kind, id);
      if (kind === 'zjazdy') Object.values(S.meetings).filter(x => x.zjazdId === id).forEach(x => { delete S.meetings[x.id]; persist('meetings', x.id); });
      render(); toast('Usunięto na zawsze.'); break; }
    case 'backup': save('pulpit-mc-kopia-' + todayStr() + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), meetings: S.meetings, zjazdy: S.zjazdy }, null, 2), 'Kopia zapasowa zapisana.'); break;

    case 'stage': openStage(); break;
    case 'stage-here': openStage(r.item.id); break;
    case 'reuse': { const src = S.meetings[a.dataset.mid]; S.sheet = { type: 'new', init: src.initiative, zid: src.initiative === 'sum' ? src.zjazdId : null, base: src.id }; render(); break; }
    case 'undo': doUndo(); break;
    case 'gaps': S.gaps = !S.gaps; render(); break;
    case 'clear-times': delete m.actual; delete m.actualAt; persist('meetings', m.id); render(); toast('Wyczyszczono zapisane czasy.'); break;
    case 'toggle': { const id = li.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); break; }
    case 'up': case 'down': { const j = r.index + (act === 'up' ? -1 : 1); if (j < 0 || j >= r.list.length) break; pushUndo(m, 'przesunięcie'); [r.list[r.index], r.list[j]] = [r.list[j], r.list[r.index]]; persist('meetings', m.id); render(); break; }
    case 'hide': pushUndo(m, r.item.hidden ? 'pokazanie' : 'ukrycie'); r.item.hidden = !r.item.hidden; persist('meetings', m.id); render(); break;
    case 'delete': { pushUndo(m, 'usunięcie'); r.list.splice(r.index, 1); m.trash = m.trash || []; m.trash.push({ item: r.item, parentId: r.parent ? r.parent.id : null, parentTitle: r.parent ? r.parent.title : '', index: r.index, at: Date.now() }); while (m.trash.length > 40) m.trash.shift(); persist('meetings', m.id); render(); toast('Usunięto „' + (r.item.title || 'Bez nazwy') + '”.', 'Cofnij', doUndo); break; }
    case 'add-child': { pushUndo(m, 'dodanie podpunktu'); const c = P(''); r.item.children.push(c); S.expanded.add(c.id); persist('meetings', m.id); render(); $('#f-' + c.id + '-title').focus(); break; }
    case 'add-block': case 'add-divider': { pushUndo(m, 'dodanie'); const b = act === 'add-block' ? B('') : D('Przerywnik'); m.items.push(b); S.expanded.add(b.id); persist('meetings', m.id); render(); const f = $('#f-' + b.id + '-title'); f.focus(); f.select(); break; }
    case 'trash-items': case 'versions': S.sheet = { type: act }; render(); break;
    case 'restore-item': { const k = Number(a.closest('[data-ti]').dataset.ti), t = m.trash[k]; pushUndo(m, 'przywrócenie'); m.trash.splice(k, 1);
      const parent = t.parentId ? m.items.find(b => b.id === t.parentId) : null, list = t.parentId ? (parent ? parent.children : m.items) : m.items;
      list.splice(Math.min(t.index, list.length), 0, t.item); persist('meetings', m.id); S.sheet = null; render(); toast('Przywrócono „' + (t.item.title || 'Bez nazwy') + '”.'); break; }
    case 'restore-version': { const v = m.versions[Number(a.closest('[data-vi]').dataset.vi)]; S.undo.push({ id: m.id, items: clone(m.items), trash: clone(m.trash || []), label: 'przywrócenie wersji' }); m.items = cloneItems(v.items); persist('meetings', m.id); S.sheet = null; render(); toast('Przywrócono wersję z ' + fmtStamp(v.at) + '.', 'Cofnij', doUndo); break; }
    case 'duplicate': { const c = { ...clone(m), id: rid(), title: m.title + ' (kopia)', items: cloneItems(m.items), trash: [], versions: [], actual: null, createdAt: Date.now(), deletedAt: null }; S.meetings[c.id] = c; persist('meetings', c.id); openMeeting(c.id); toast('Utworzono kopię spotkania.'); break; }
    case 'del-meeting': { m.deletedAt = Date.now(); persist('meetings', m.id); S.view = 'home'; render(); toast('Spotkanie przeniesione do kosza.', 'Cofnij', () => { m.deletedAt = null; persist('meetings', m.id); openMeeting(m.id); }); break; }
    case 'stage-link': makeStageLink(m).then(url => { S.sheet = { type: 'link', url }; render(); }).catch(() => toast('Nie udało się utworzyć linku.')); break;
    case 'copy-link': { const u = S.sheet && S.sheet.url; const ta = $('#link-text'); try { navigator.clipboard.writeText(u).then(() => toast('Skopiowano link.'), () => { ta.select(); toast('Zaznaczyłem link, skopiuj go ręcznie.'); }); } catch (err) { ta.select(); toast('Zaznaczyłem link, skopiuj go ręcznie.'); } break; }
    case 'download': save(fileName(m, 'html'), buildStandalone(m), 'Zapisano. Otwórz plik w przeglądarce telefonu, działa bez internetu.'); break;
    case 'download-txt': save(fileName(m, 'txt'), buildText(m), 'Zapisano plik tekstowy.'); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q !== undefined) { S.q = t.value; const box = $('#arch-results'); if (box) box.innerHTML = archiveResults(t.dataset.q); return; }
  if (t.tagName === 'TEXTAREA') autosize(t);
  const m = cur();
  if (t.dataset.f && m) {
    const li = t.closest('[data-id]'), r = find(m, li.dataset.id); if (!r) return;
    const k = t.dataset.f;
    r.item[k] = k === 'minutes' ? (t.value === '' ? null : Math.max(0, Number(t.value))) : t.value;
    li.querySelector(':scope > .item-row > .item-head').innerHTML = headInner(r.item, r.parent);
    const tot = $('#m-total'); if (tot) tot.textContent = totalMin(m) + ' min';
    persist('meetings', m.id);
  } else if (t.dataset.mf && m) {
    m[t.dataset.mf] = t.value; persist('meetings', m.id);
  } else if (t.dataset.zf) {
    const z = S.zjazdy[t.closest('[data-zid]').dataset.zid]; z[t.dataset.zf] = t.value; persist('zjazdy', z.id);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });

/* ---------- Przeciąganie ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h || S.view !== 'editor') return;
  const li = h.closest('li.item'), list = li.parentElement;
  e.preventDefault();
  drag = { li, list, id: li.dataset.id, grab: e.clientY - li.getBoundingClientRect().top };
  li.classList.add('dragging'); document.body.classList.add('is-dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const { li, list } = drag, y = e.clientY;
  let target = null;
  for (const sb of list.children) { if (sb === li) continue; const r = sb.getBoundingClientRect(); if (y < r.top + r.height / 2) { target = sb; break; } }
  if (target) { if (li.nextElementSibling !== target) list.insertBefore(li, target); } else if (list.lastElementChild !== li) list.appendChild(li);
  li.style.transform = '';
  const nat = li.getBoundingClientRect().top;
  li.style.transform = `translateY(${y - drag.grab - nat}px)`;
  if (y < 70) window.scrollBy(0, -12); else if (y > window.innerHeight - 70) window.scrollBy(0, 12);
});
function endDrag(){
  if (!drag) return;
  const { li, list, id } = drag; drag = null;
  li.classList.remove('dragging'); li.style.transform = ''; document.body.classList.remove('is-dragging');
  const m = cur(); if (!m) return;
  const order = [...list.children].map(x => x.dataset.id);
  const r = find(m, id); if (!r) return;
  if (order.join(',') === r.list.map(x => x.id).join(',')) return;
  pushUndo(m, 'przesunięcie');
  const byId = Object.fromEntries(r.list.map(x => [x.id, x]));
  const next = order.map(k => byId[k]).filter(Boolean);
  r.list.splice(0, r.list.length, ...next);
  persist('meetings', m.id); render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- Start ---------- */
async function init(){
  try { const c = JSON.parse(lsGet('mc-cache-v1') || 'null'); if (c) { S.meetings = c.meetings || {}; S.zjazdy = c.zjazdy || {}; } } catch (e) {}
  render();
  const c = window.claude;
  if (!c || !c.use) { S.mode = 'local'; S.loaded = true; setSync('local'); render(); return; }
  const [db, user, dl] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null), c.use('downloads').catch(() => null)]);
  DL = dl;
  let id = null; try { id = user ? await user.id() : null; } catch (e) {}
  if (!db || !id) { S.mode = 'local'; S.loaded = true; setSync('local'); render(); return; }
  DB = db; S.mode = 'db'; BASE = db.doc('data/users/' + id + '/app');
  subscribe('meetings'); subscribe('zjazdy');
  render();
}
init();
</script>
