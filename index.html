<style>
/* Układ: jedna kolumna (max 760 px), karty spotkań i bloków planu; scena to osobna, zawsze ciemna nakładka. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eceef2; --line:#dde1e8;
  --ink:#151820; --ink-2:#5b6271; --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e2ebf8;
  --danger:#b42318; --ok:#1f7a4d; --warn:#9a5b00;
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --r:12px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
  --ink:#eef0f4; --ink-2:#9aa2b1; --accent:#5b9cf5; --accent-ink:#06142b; --accent-soft:#142235;
  --danger:#ff8a7a; --ok:#5fd39a; --warn:#f0a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
  --ink:#eef0f4; --ink-2:#9aa2b1; --accent:#5b9cf5; --accent-ink:#06142b; --accent-soft:#142235;
  --danger:#ff8a7a; --ok:#5fd39a; --warn:#f0a640; color-scheme:dark}

[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:var(--s2);
  padding-block:var(--s3);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
.brand{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding-block:var(--s4) 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--s4)}

.btn{text-decoration:none;min-height:44px;padding:0 var(--s4);border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:40px;padding:0 var(--s3);font-size:14px}
.btn.danger-ghost{color:var(--danger);background:transparent}
.btn.big{min-height:52px;font-size:17px;width:100%}
.btn:focus-visible,.card:focus-visible,.item-head:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.sync{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:400;text-align:right}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync.s-saved::before{background:var(--ok)}
.sync.s-saving::before{background:var(--accent)}
.sync.s-offline::before,.sync.s-error::before,.sync.s-local::before{background:var(--danger)}

.tabs{display:grid;grid-template-columns:1fr 1.3fr .8fr .8fr .55fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:var(--r)}
.tab{min-height:48px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.sec{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:var(--s2) 0 0;font-weight:700}
.cards{display:flex;flex-direction:column;gap:var(--s2)}
.card{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);text-align:left;padding:var(--s4);border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%}
.card:hover{border-color:var(--ink-2)}
.card-date{font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.card-title{grid-column:1;font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.card-meta{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:13px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.card-sub{grid-column:1;font-size:14px;color:var(--ink-2)}
.empty{color:var(--ink-2);margin:0;padding:var(--s4);border:1px dashed var(--line);border-radius:var(--r)}

.meta-card{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.title-input{font-family:var(--font-display);font-size:24px;font-weight:700;border:0;background:transparent;padding:4px 0;width:100%;border-bottom:1px solid transparent}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.meta-row{display:flex;gap:var(--s3);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.meta-row>.fld{flex:1 1 120px}
.fld>span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.fld input,.fld textarea,.fld select{min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.fld textarea{resize:none;line-height:1.45;overflow:hidden}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld.w-num{flex:0 0 110px}
.fld.total{flex:0 0 auto}
.fld.total b{min-height:44px;display:flex;align-items:center;font-size:20px;font-variant-numeric:tabular-nums}

.items,.children{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item.k-divider{background:transparent;border-style:dashed}
.children{padding:0 var(--s2) var(--s2) var(--s5)}
.children:empty{display:none}
.children .item{background:var(--bg)}
.item-head{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);width:100%;text-align:left;background:transparent;border:0;padding:var(--s3) var(--s4);min-height:52px;cursor:pointer;border-radius:var(--r)}
.item-title{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.k-block>.item-head .item-title{font-size:18px}
.k-divider>.item-head .item-title{text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--ink-2)}
.item-meta{font-size:14px;color:var(--ink-2);align-self:center;text-align:right;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.item-peek{grid-column:1 / -1;font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:700}
.item.is-hidden>.item-head .item-title{opacity:.5;text-decoration:line-through}
.item.is-open{border-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:var(--s3);padding:0 var(--s4) var(--s4)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2)}
.add-row,.tools,.row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.tools{padding-top:var(--s4);border-top:1px solid var(--line)}

.zjazd{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.zj-head{display:flex;justify-content:space-between;gap:var(--s3);align-items:flex-start}
.zj-title{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0}
.zj-sub{font-size:14px;color:var(--ink-2)}
.zjazd .card{background:var(--bg)}

.trash{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.trash summary{padding:var(--s3) var(--s4);cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.trash-list{list-style:none;margin:0;padding:0 var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.trash-list li{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap;padding-top:var(--s2);border-top:1px solid var(--line)}
.trash-list small{color:var(--ink-2);display:block}

.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding-block:var(--s5) calc(var(--s5) + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--s4)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0}
.sheet p{margin:0;color:var(--ink-2)}
.sheet .row{justify-content:flex-end}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:var(--s3);max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:15px}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.search{min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;font-size:16px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.card-snip{grid-column:1 / -1;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.card-snip mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.arch-item{display:flex;flex-direction:column;gap:6px}
.arch-item .btn{align-self:flex-end}
.banner{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;padding:var(--s2) var(--s3);border-radius:10px;background:var(--accent-soft);font-size:14px}
.item-row{display:flex;align-items:stretch}
.handle{flex:0 0 auto;width:36px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:grab;touch-action:none;font-size:18px;border-radius:var(--r) 0 0 var(--r);-webkit-user-select:none;user-select:none}
.item-row .item-head{padding-left:0;min-width:0}
.item.dragging{box-shadow:0 8px 24px rgba(0,0,0,.25);border-color:var(--accent);position:relative;z-index:3}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.actual{color:var(--ink-2);font-style:italic;font-size:13px}
.gaps{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.tag.gap{background:var(--accent-soft);color:var(--accent)}
.item.is-gap{border-color:var(--accent);border-style:dashed}
.list-tools{display:flex;justify-content:flex-end;margin-bottom:calc(var(--s2) * -1)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.foot-tools{display:flex;justify-content:center;gap:var(--s2);flex-wrap:wrap}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;cursor:pointer;flex:0 0 auto}
.avatar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:var(--s4);padding:var(--s5);background:var(--surface);border:1px solid var(--line);border-radius:18px}
.auth-card .brand{font-size:30px}
.auth-card p{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.check-list label{display:flex;gap:var(--s3);align-items:center;min-height:52px;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.check-list input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.check-list small{display:block;color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.check-list span{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip span{color:var(--ink-2);font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip input{accent-color:var(--accent);width:18px;height:18px;margin:0}
fieldset.fld{border:0;padding:0;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:var(--r)}
.seg-b{min-height:40px;border:0;border-radius:8px;background:transparent;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg-b[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.game-card{grid-template-columns:1fr}
.game-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag.warn{background:var(--danger);color:var(--surface)}
.chip.sm{min-height:36px;font-size:13px}
.chip.roll{border-color:var(--accent);color:var(--accent)}
.rolled{display:flex;flex-direction:column;gap:6px;padding:var(--s2);border:2px solid var(--accent);border-radius:calc(var(--r) + 4px)}
.rolled-h{display:flex;align-items:center;gap:var(--s2);font-weight:700;color:var(--accent)}
.rolled-h span{flex:1}
.hint{margin:0;color:var(--ink-2);font-size:14px}
.help-b{font-size:18px;color:var(--ink-2)}
details.help{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
details.help summary{padding:var(--s3) var(--s4);min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.help>div{padding:0 var(--s4) var(--s3);color:var(--ink)}
details.help ol,details.help ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
details.help p{color:var(--ink);margin:6px 0 0}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.people>li{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);border:1px solid var(--line);border-radius:var(--r)}
.people-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.people small{display:block;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab[data-k="sandbox"]{font-size:20px}
.sandbox-intro{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.sandbox-intro h2{font-family:var(--font-display);margin:0;font-size:22px}
.sandbox-intro p{margin:0}
.tasks,.map{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:var(--s2)}
.map{list-style:none;padding:0}
.tasks li span,.map li span{display:block;color:var(--ink-2);font-size:15px}
.map li{display:flex;gap:var(--s2);align-items:baseline}.map li b{flex:0 0 auto}.map li span{display:inline}
.req-note{margin:0;color:var(--ink);font-style:italic;overflow-wrap:anywhere;white-space:pre-wrap}
.avatar{position:relative}
.avatar.has-badge::after{content:"";position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
.auth-card .fld textarea{overflow:auto}
.tab{padding:0 4px;line-height:1.15}
.sheet .sp{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="stage-root" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script type="module">
import * as F from './lib/firebase-12.19.0.js';
import { FIREBASE_CONFIG } from './config.js';
/* ---------- Widok sceniczny (samowystarczalny: używany też w pobranym pliku) ---------- */
const STAGE_CSS = `
.st{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column;font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-user-select:none;user-select:none;touch-action:manipulation;color-scheme:dark}
.st *{box-sizing:border-box}
.st-top{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.st-count{display:inline-flex;align-items:center;gap:6px;padding:0 10px;font-size:17px;color:#e8eaf0;font-variant-numeric:tabular-nums}
.st-burger{font-size:18px;color:#6aa8ff}
.st-prevline{display:block;max-width:100%;background:none;border:0;padding:0 0 10px;margin:0;color:#7d8494;font:inherit;font-size:calc(var(--fs) * .55);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.st-plan{position:absolute;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.st-plan[hidden]{display:none}
.st-plan-h{display:flex;align-items:baseline;gap:12px;padding:16px 20px 8px;font-size:22px}
.st-plan-late{font-size:16px;color:#a8aebb}.st-plan-late.over{color:#ff8a7a}
.st-plan-list{list-style:none;margin:0;padding:0 12px 12px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.st-plan-blk{color:#6aa8ff;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px 8px 4px}
.st-plan-it{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;text-align:left;min-height:52px;padding:8px;border:1px solid transparent;border-radius:12px;background:none;color:#fff;font:inherit;font-size:19px;cursor:pointer}
.st-plan-it.sub{padding-left:20px}
.st-plan-it.div{color:#a8aebb;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.st-plan-it.done{opacity:.45}
.st-plan-it.now{border-color:#6aa8ff;background:#1d1608}

.st-plan-t,.st-plan-m{color:#a8aebb;font-size:15px;font-variant-numeric:tabular-nums}
.st-plan-back{margin:8px 12px 12px;min-height:64px;border-radius:14px;border:0;background:#6aa8ff;color:#06142b;font:inherit;font-size:20px;font-weight:700;cursor:pointer}

function saveCache(){ lsSet(cacheKey(), JSON.stringify({ meetings: S.meetings, zjazdy: S.zjazdy, games: S.games, ann: S.ann })); }
const pend = new Map(); let flushT = null;
function persist(kind, id){
  const obj = S[kind][id];
  if (obj) obj.updatedAt = Date.now();
  saveCache();
  if (S.mode !== 'db') { renderSync(); return; }
  pend.set(kind + ':' + id, obj || null);
  setSync('saving');
  clearTimeout(flushT); flushT = setTimeout(flush, 700);
}
function writeErr(e){
  const c = e && e.code;
  if (c === 'permission-denied') toast('Brak uprawnień do zapisu. Poproś Tymka o dostęp do tego spotkania.');
  else if (c === 'resource-exhausted') toast('Dzienny limit bazy wyczerpany. Spróbuj jutro.');
  else if (c === 'invalid-argument') toast('Nie udało się zapisać: spotkanie jest za duże. Skróć notatki albo historię wersji.');
  else toast('Błąd zapisu (' + (c || 'nieznany') + ').');
  setSync('error');
}
function flush(){
  for (const [k, v] of pend) {
    const [kind, id] = k.split(':'), ref = F.doc(FDB, kind, id);
    (v === null ? F.deleteDoc(ref) : F.setDoc(ref, clone(v))).catch(writeErr);
  }
  pend.clear();
  syncFromMeta();
}
function syncFromMeta(){
  if (S.mode !== 'db' || S.sync === 'error') return;
  if (pend.size) return setSync('saving');
  const waiting = Object.values(hasPending).some(Boolean);
  setSync(!waiting ? 'saved' : navigator.onLine ? 'saving' : 'offline');
}

const SRC = {};

function subscribe(kind){
  const col = F.collection(FDB, kind);
  if (IS_ADMIN || kind === 'games' || kind === 'ann') return listen(kind, 'all', col);
  const inits = myInits();
  if (kind === 'zjazdy' && inits.includes('sum')) return listen(kind, 'all', col);
  listen(kind, 'mem', F.query(col, F.where('members', 'array-contains', ME.email)));
  if (kind === 'meetings' && inits.length) listen(kind, 'init', F.query(col, F.where('initiative', 'in', inits)));
  if (kind === 'meetings') listen(kind, 'sandbox', F.query(col, F.where('initiative', '==', 'sandbox')));
}
function listen(kind, key, q){
  SRC[kind] = SRC[kind] || {};
  unsubs.push(F.onSnapshot(q, { includeMetadataChanges: true }, snap => {
    hasPending[kind + key] = snap.metadata.hasPendingWrites;
    if (snap.metadata.fromCache && snap.empty) { syncFromMeta(); return; }
    const changed = snap.docChanges().length > 0 || !S.loaded;
    if (changed) {
      SRC[kind][key] = {};
      snap.docs.forEach(d => { SRC[kind][key][d.id] = d.data(); });
      const next = Object.assign({}, ...Object.values(SRC[kind]));
      for (const k of pend.keys()) { const [kk, id] = k.split(':'); if (kk === kind) { if (S[kind][id]) next[id] = S[kind][id]; else delete next[id]; } }
      S[kind] = next; saveCache();
    }
    if (kind === 'meetings' && key !== 'init' && !snap.metadata.fromCache) { S.loaded = true; purgeOld(); }
    if (S.sync === 'loading' || S.sync === 'error') S.sync = 'saved';
    syncFromMeta();
    if (changed) softRender();
  }, err => { setSync('error'); toast(err && err.code === 'permission-denied' ? 'Brak dostępu do danych. Poproś Tymka o dodanie.' : 'Nie udało się wczytać danych.'); }));
}

}
let purged = false;
function purgeOld(){
  if (purged) return; purged = true;
  const lim = Date.now() - 30 * 864e5;
  Object.values(S.meetings).forEach(m => { if (m.deletedAt && m.deletedAt < lim) { delete S.meetings[m.id]; persist('meetings', m.id); } });
  Object.values(S.zjazdy).forEach(z => { if (z.deletedAt && z.deletedAt < lim) { delete S.zjazdy[z.id]; persist('zjazdy', z.id); } });
  if (IS_ADMIN || S.mode === 'local') ['games', 'ann'].forEach(k => Object.values(S[k]).forEach(o => { if (o.deletedAt && o.deletedAt < lim) { delete S[k][o.id]; persist(k, o.id); } }));
}

function actualSec(m, it){ const a = (m && m.actual) || {}; return (a[it.id] || 0) + (it.children || []).reduce((s, c) => s + (a[c.id] || 0), 0); }
function gapsOf(it, parent){
  if (it.hidden || it.kind === 'divider' || (parent && parent.hidden)) return [];
  if (it.kind === 'block' && (it.children || []).some(c => !c.hidden)) return [];
  const g = [];
  if (!it.leader && !(parent && parent.leader)) g.push('brak prowadzącego');
  if (!it.say && !it.note) g.push('brak notatki');
  return g;
}
function gapCount(m){ let n = 0; (m.items || []).forEach(b => { if (gapsOf(b, null).length) n++; (b.children || []).forEach(c => { if (gapsOf(c, b).length) n++; }); }); return n; }
function headInner(it, parent){
  const open = S.expanded.has(it.id), m = cur(), act = actualSec(m, it);
  const meta = [it.leader, hasMin(it.minutes) ? it.minutes + ' min' : ''].filter(Boolean).join(' · ');
  const gaps = S.gaps ? gapsOf(it, parent) : [];
  const peek = (!open && (it.say || it.note)) ? `<span class="item-peek">${esc((it.say || it.note).replace(/\s+/g, ' ').slice(0, 120))}</span>` : '';
  return `<span class="item-title">${it.title ? esc(it.title) : '<i>Bez nazwy</i>'}</span>
    <span class="item-meta">${it.hidden ? '<span class="tag">ukryte</span>' : ''}${esc(meta)}${act >= 30 ? `<span class="actual" title="Faktyczny czas z ostatniej sceny">było ${Math.round(act / 60)} min</span>` : ''}</span>${peek}
    ${gaps.length ? `<span class="gaps">${gaps.map(g => `<span class="tag gap">${g}</span>`).join('')}</span>` : ''}`;
}
function itemHtml(it, i, n, parent){
  const open = S.expanded.has(it.id), gap = S.gaps && gapsOf(it, parent).length;
  return `<li class="item k-${it.kind}${it.hidden ? ' is-hidden' : ''}${open ? ' is-open' : ''}${gap ? ' is-gap' : ''}" data-id="${it.id}">

  </li>`;
}

const GAME_CATS = { gra: 'Gra', ice: 'Ice breaker', team: 'Team building', taniec: 'Taniec' };
const ENERGY = { spokojna: 'Spokojna', srednia: 'Średnia energia', wysoka: 'Wysoka energia' };
const gameHasDesc = g => !!((g.rules || '').trim() || (g.link || '').trim());
function gameLastUsed(gid){
  let best = null;
  Object.values(S.meetings).forEach(m => { if (m.deletedAt || !m.date || m.initiative === 'sandbox') return; (m.items || []).forEach(function w(it){ if (it.gameId === gid && (!best || m.date > best.date)) best = m; (it.children || []).forEach(w); }); });
  return best;
}
const dayNo = d => { const [y, m, dd] = d.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, dd) / 864e5); };
function gameRecent(gid, ref, exceptMid){
  // Najbliższe użycie gry w innym spotkaniu w promieniu 21 dni od daty odniesienia.
  let best = null; const r = dayNo(ref || todayStr());
  Object.values(S.meetings).forEach(m => { if (m.deletedAt || !m.date || m.id === exceptMid || m.initiative === 'sandbox') return; const d = Math.abs(dayNo(m.date) - r); if (d > 21) return;
    (m.items || []).forEach(function w(it){ if (it.gameId === gid && (!best || d < best.days)) best = { m, days: d }; (it.children || []).forEach(w); }); });
  return best;
}
const recentLabel = x => x.days === 0 ? 'w tym samym dniu' : x.days < 7 ? x.days + ' ' + pl(x.days, 'dzień', 'dni', 'dni') + ' od tego' : Math.round(x.days / 7) + ' ' + pl(Math.round(x.days / 7), 'tydzień', 'tygodnie', 'tygodni') + ' od tego';
function gameMeta(g){

}

  return `<button type="button" class="card game-card" data-act="${pick ? 'pick-game' : 'open-game'}" data-gid="${g.id}">
    <span class="card-title">${esc(g.title || 'Bez nazwy')}</span>
    <span class="game-tags">${gameMeta(g).map(t => `<span class="tag">${esc(t)}</span>`).join('')}${gameHasDesc(g) ? '' : '<span class="tag gap">brak opisu</span>'}${g.link ? '<span class="tag">link</span>' : ''}${rec ? `<span class="tag warn">była ${shortDate(rec.m.date)}</span>` : ''}</span>

function filteredGames(){

function accessSummary(p){

function addPerson(){

function setMember(kind, id, em, on){
  const o = S[kind][id]; if (!o) return;
  const apply = x => { x.members = on ? uniq([...(x.members || []), em]) : (x.members || []).filter(e => e !== em); };
  apply(o); persist(kind, id);
  if (kind === 'zjazdy') Object.values(S.meetings).filter(m => m.zjazdId === id).forEach(m => { apply(m); persist('meetings', m.id); });

async function importBackup(file){
  let data; try { data = JSON.parse(await file.text()); } catch (e) { toast('To nie jest plik kopii Pulpitu MC.'); return; }
  const ms = Object.values(data.meetings || {}), zs = Object.values(data.zjazdy || {});
  const gs = Object.values(data.games || {}), as = Object.values(data.ann || {});
  if (!ms.length && !zs.length && !gs.length && !as.length) { toast('Kopia jest pusta.'); return; }
  let n = 0;
  gs.forEach(g => { if (g && g.id) { S.games[g.id] = g; persist('games', g.id); n++; } });
  as.forEach(a => { if (a && a.id) { S.ann[a.id] = a; persist('ann', a.id); n++; } });
  zs.forEach(z => { if (!z || !z.id) return; z.members = uniq([...(z.members || []), ME.email]); S.zjazdy[z.id] = z; persist('zjazdy', z.id); n++; });
  ms.forEach(m => { if (!m || !m.id) return; const z = m.zjazdId && S.zjazdy[m.zjazdId]; m.members = uniq([...(m.members || []), ...((z && z.members) || []), ME.email]); S.meetings[m.id] = m; persist('meetings', m.id); n++; });
  S.sheet = null; render(); toast('Wczytano ' + n + ' ' + pl(n, 'element', 'elementy', 'elementów') + ' z kopii.');
}

function openMeeting(id){ S.openId = id; S.view = 'editor'; S.expanded.clear(); render(); window.scrollTo(0, 0); }

    mc: sum ? ($('#n-mc').value || '').trim() : '', items: src ? cloneItems(src.items) : base === 'empty' ? [] : (sum || base === 'tpl-sum' ? templateSum() : templateMlo()),
    trash: [], versions: [], members: newMembers(sum ? s.zid : null), author: myFirstName(), createdAt: Date.now(), deletedAt: null };

function stageData(m){ return { title: m.title, date: m.date, start: m.start, mc: m.mc, initiativeName: INIT[m.initiative].name + (m.zjazdId && S.zjazdy[m.zjazdId] ? ' · ' + S.zjazdy[m.zjazdId].title : ''), items: m.items }; }

function staticHtml(d, stamp){
  let h = `<header class="sx-h"><p>${esc(d.initiativeName)}${d.date ? ' · ' + esc(d.date.split('-').reverse().join('.')) : ''}${d.start ? ' · start ' + esc(d.start) : ''}</p><h1>${esc(d.title)}</h1>${d.mc ? `<p>MC: ${esc(d.mc)}</p>` : ''}<p>Kopia z ${esc(stamp)}</p></header>`;
  (d.items || []).filter(b => !b.hidden).forEach(b => {
    const meta = it => [it.leader, hasMin(it.minutes) ? it.minutes + ' min' : ''].filter(Boolean).map(esc).join(' · ');
    const body = it => (it.say ? `<p class="sx-say">${esc(it.say)}</p>` : '') + (it.note ? `<p class="sx-note">Dla Ciebie: ${esc(it.note)}</p>` : '');
    h += `<section class="sx-b"><h2>${esc(b.title)}</h2>${meta(b) ? `<p class="sx-m">${meta(b)}</p>` : ''}${body(b)}`;
    (b.children || []).filter(c => !c.hidden).forEach(c => { h += `<div class="sx-p"><h3>${esc(c.title)}</h3>${meta(c) ? `<p class="sx-m">${meta(c)}</p>` : ''}${body(c)}</div>`; });
    h += '</section>';
  });
  return h;
}
const STATIC_CSS = `[hidden]{display:none!important}html,body{margin:0;background:#000;color:#fff}body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:24px;line-height:1.4}#static{padding:24px 20px 60px}.sx-h p{color:#a8aebb;font-size:18px;margin:4px 0}.sx-h h1{margin:8px 0}.sx-b{border-top:2px solid #6aa8ff;margin-top:28px;padding-top:12px}.sx-b h2{color:#6aa8ff;margin:0 0 6px}.sx-p{margin:16px 0 0 12px}.sx-p h3{margin:0 0 4px}.sx-m{color:#a8aebb;font-size:18px;margin:0 0 6px}.sx-say{white-space:pre-wrap;margin:0 0 8px}.sx-note{white-space:pre-wrap;color:#cfe2ff;font-size:20px;margin:0}`;
function buildStandalone(m){
  const d = stageData(m), stamp = fmtStamp(Date.now());
  const json = JSON.stringify(d).replace(/</g, '\\u003c');
  return '<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>' + esc(m.title) + '</title><style>' + STATIC_CSS + STAGE_CSS + '</style></head><body>' +
    '<div id="static">' + staticHtml(d, stamp) + '</div><div id="stage"></div>' +
    '<script>try{var M=' + json + ';document.getElementById("static").hidden=true;(' + mountStage.toString() + ')(document.getElementById("stage"),M,{standalone:true,exported:' + JSON.stringify(stamp) + '});}catch(e){document.getElementById("static").hidden=false;}<\/script></body></html>';
}
function buildText(m){
  const d = stageData(m);
  let t = `${d.title}\n${d.initiativeName}${d.date ? ' · ' + d.date.split('-').reverse().join('.') : ''}${d.start ? ' · start ' + d.start : ''}\n${d.mc ? 'MC: ' + d.mc + '\n' : ''}\n`;
  const line = (it, ind) => { let s = ind + it.title + ([it.leader, hasMin(it.minutes) ? it.minutes + ' min' : ''].filter(Boolean).length ? '  [' + [it.leader, hasMin(it.minutes) ? it.minutes + ' min' : ''].filter(Boolean).join(', ') + ']' : '') + '\n';
    if (it.say) s += it.say.split('\n').map(l => ind + '  ' + l).join('\n') + '\n'; if (it.note) s += ind + '  (dla Ciebie: ' + it.note.replace(/\n/g, ' ') + ')\n'; return s; };
  d.items.filter(b => !b.hidden).forEach(b => { t += '\n' + line(b, '').replace(/^/, '■ '); (b.children || []).filter(c => !c.hidden).forEach(c => { t += line(c, '   • '); }); });
  return t;
}
const SCENA_URL = new URL('scena/', location.href.split(/[?#]/)[0]).href;
async function makeStageLink(m){
  const d = stageData(m);
  d.items = clone(d.items).filter(b => !b.hidden).map(b => { b.children = (b.children || []).filter(c => !c.hidden); return b; });
  d.exportedAt = fmtStamp(Date.now());
  const raw = new TextEncoder().encode(JSON.stringify(d));
  const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  let bin = ''; new Uint8Array(buf).forEach(b => { bin += String.fromCharCode(b); });
  return SCENA_URL + '#p=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const fileName = (m, ext) => ('MC ' + (m.date || '') + ' ' + (m.title || 'spotkanie')).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim() + '.' + ext;
const MIME = { html: 'text/html', txt: 'text/plain', json: 'application/json' };
function save(filename, data, okMsg){
  try {
    const url = URL.createObjectURL(new Blob([data], { type: (MIME[filename.split('.').pop()] || 'application/octet-stream') + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); toast(okMsg);
  } catch (e) { toast('Nie udało się pobrać pliku.'); }
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'sheet-bg' && e.target !== a) return;
  const li = a.closest('[data-id]'), m = cur();
  const r = li && m ? find(m, li.dataset.id) : null;
  switch (act) {
    case 'tab': S.tab = a.dataset.k; lsSet('mc-tab', S.tab); S.showPast = false; S.q = ''; render(); break;
    case 'open': openMeeting(a.dataset.mid); break;
    case 'home': S.view = 'home'; S.openId = null; render(); window.scrollTo(0, 0); break;
    case 'show-past': S.showPast = true; render(); break;
    case 'new': S.sheet = { type: 'new', init: a.dataset.k, zid: a.closest('[data-zid]') ? a.closest('[data-zid]').dataset.zid : null }; render(); setTimeout(() => { const t = $('#n-title'); if (t && matchMedia('(pointer:fine)').matches) t.focus(); }, 0); break;
    case 'create': createMeeting(); break;
    case 'sheet-close': case 'sheet-bg': S.sheet = null; render(); break;
    case 'new-zjazd': { const n = Object.values(S.zjazdy).filter(z => !z.deletedAt).length + 1; const z = { id: rid(), title: 'Zjazd ' + n, dates: '', team: '', members: newMembers(null), createdAt: Date.now(), deletedAt: null }; S.zjazdy[z.id] = z; persist('zjazdy', z.id); S.expanded.add(z.id); render(); break; }
    case 'zj-edit': { const zid = a.closest('[data-zid]').dataset.zid; S.expanded.has(zid) ? S.expanded.delete(zid) : S.expanded.add(zid); render(); break; }
    case 'del-zjazd': { const z = S.zjazdy[a.closest('[data-zid]').dataset.zid]; z.deletedAt = Date.now(); persist('zjazdy', z.id); render(); toast('Zjazd przeniesiony do kosza.', 'Cofnij', () => { z.deletedAt = null; persist('zjazdy', z.id); render(); }); break; }
    case 'restore': { const row = a.closest('[data-oid]'), o = S[row.dataset.kind][row.dataset.oid]; o.deletedAt = null; persist(row.dataset.kind, o.id); S.confirm = null; render(); toast('Przywrócono.'); break; }
    case 'purge': { const row = a.closest('[data-oid]'), kind = row.dataset.kind, id = row.dataset.oid;
      if (S.confirm !== id) { S.confirm = id; render(); break; }
      S.confirm = null; delete S[kind][id]; persist(kind, id);
      if (kind === 'zjazdy') Object.values(S.meetings).filter(x => x.zjazdId === id).forEach(x => { delete S.meetings[x.id]; persist('meetings', x.id); });
      render(); toast('Usunięto na zawsze.'); break; }
    case 'backup': save('pulpit-mc-kopia-' + todayStr() + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), meetings: S.meetings, zjazdy: S.zjazdy, games: S.games, ann: S.ann }, null, 2), 'Kopia zapasowa zapisana.'); break;

    case 'base-tab': S.baseTab = a.dataset.k; render(); break;
    case 'gcat': S.gcat = a.dataset.k; render(); break;
    case 'gen': S.gen = S.gen === a.dataset.k ? '' : a.dataset.k; render(); break;
    case 'roll': rollGame(); break;
    case 'unroll': S.rolled = null; render(); break;
    case 'seed-games': seedGames(); break;
    case 'new-game': { const g = newGame(); S.games[g.id] = g; persist('games', g.id); S.sheet = { type: 'game', gid: g.id }; render(); const f = $('#g-' + g.id + '-title'); if (f) f.focus(); break; }
    case 'open-game': S.sheet = { type: 'game', gid: a.dataset.gid }; render(); break;
    case 'del-game': { const g = S.games[S.sheet.gid]; g.deletedAt = Date.now(); persist('games', g.id); S.sheet = null; render(); toast('Gra przeniesiona do kosza.', 'Cofnij', () => { g.deletedAt = null; persist('games', g.id); render(); }); break; }
    case 'insert-game': S.sheet = { type: 'game-pick', itemId: r.item.id }; S.rolled = null; S.gcat = ''; S.gen = ''; S.gq = ''; render(); break;
    case 'pick-game': insertGame(S.games[a.dataset.gid]); break;
    case 'new-ann': { const n = { id: rid(), title: '', text: '', until: '', inits: [], createdAt: Date.now(), deletedAt: null }; S.ann[n.id] = n; persist('ann', n.id); S.sheet = { type: 'ann', aid: n.id }; render(); const f = $('#a-' + n.id + '-title'); if (f) f.focus(); break; }
    case 'open-ann': S.sheet = { type: 'ann', aid: a.dataset.aid }; render(); break;
    case 'del-ann': { const n = S.ann[S.sheet.aid]; n.deletedAt = Date.now(); persist('ann', n.id); S.sheet = null; render(); toast('Ogłoszenie przeniesione do kosza.', 'Cofnij', () => { n.deletedAt = null; persist('ann', n.id); render(); }); break; }
    case 'insert-ann': S.sheet = { type: 'ann-pick', itemId: r.item.id }; render(); break;
    case 'pick-ann': insertAnn(S.ann[a.dataset.aid]); break;
    case 'help': S.sheet = { type: 'help' }; render(); break;
    case 'sandbox-demo': sandboxDemo(); break;
    case 'sandbox-clear': { if (S.confirm !== 'sandbox') { S.confirm = 'sandbox'; render(); break; } S.confirm = null; const now = Date.now();
      Object.values(S.meetings).filter(m => isMineSandbox(m) && !m.deletedAt).forEach(m => { m.deletedAt = now; persist('meetings', m.id); }); render(); toast('Ćwiczenia przeniesione do kosza.'); break; }
    case 'req-send': sendRequest(); break;
    case 'req-cancel': F.deleteDoc(F.doc(FDB, 'requests', ME.email)).catch(writeErr); break;
    case 'req-accept': acceptRequest(a.closest('[data-rq]').dataset.rq); break;
    case 'req-reject': { const em = a.closest('[data-rq]').dataset.rq; if (S.confirm !== 'rq:' + em) { S.confirm = 'rq:' + em; render(); break; } S.confirm = null; F.deleteDoc(F.doc(FDB, 'requests', em)).then(() => toast('Odrzucono prośbę.'), writeErr); break; }
    case 'login': login(); break;
    case 'login-retry': S.loggingIn = false; S.loginSlow = false; login(); break;
    case 'logout': logout(); break;
    case 'account': S.sheet = { type: 'account' }; render(); break;
    case 'people': S.sheet = { type: 'people' }; render(); break;
    case 'add-person': addPerson(); break;
    case 'del-person': { const em = a.closest('[data-em]').dataset.em; if (S.confirm !== em) { S.confirm = em; render(); break; } S.confirm = null; F.deleteDoc(F.doc(FDB, 'allow', em)).then(() => toast('Usunięto dostęp: ' + em), writeErr); break; }
    case 'members': S.sheet = { type: 'members', kind: a.dataset.kind, oid: a.dataset.oid }; render(); break;
    case 'import': $('#import-file').click(); break;
    case 'stage': openStage(); break;
    case 'stage-here': openStage(r.item.id); break;
    case 'reuse': { const src = S.meetings[a.dataset.mid]; S.sheet = { type: 'new', init: src.initiative, zid: src.initiative === 'sum' ? src.zjazdId : null, base: src.id }; render(); break; }
    case 'undo': doUndo(); break;
    case 'gaps': S.gaps = !S.gaps; render(); break;
    case 'clear-times': delete m.actual; delete m.actualAt; persist('meetings', m.id); render(); toast('Wyczyszczono zapisane czasy.'); break;
    case 'toggle': { const id = li.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); break; }
    case 'up': case 'down': { const j = r.index + (act === 'up' ? -1 : 1); if (j < 0 || j >= r.list.length) break; pushUndo(m, 'przesunięcie'); [r.list[r.index], r.list[j]] = [r.list[j], r.list[r.index]]; persist('meetings', m.id); render(); break; }
    case 'hide': pushUndo(m, r.item.hidden ? 'pokazanie' : 'ukrycie'); r.item.hidden = !r.item.hidden; persist('meetings', m.id); render(); break;
    case 'delete': { pushUndo(m, 'usunięcie'); r.list.splice(r.index, 1); m.trash = m.trash || []; m.trash.push({ item: r.item, parentId: r.parent ? r.parent.id : null, parentTitle: r.parent ? r.parent.title : '', index: r.index, at: Date.now() }); while (m.trash.length > 40) m.trash.shift(); persist('meetings', m.id); render(); toast('Usunięto „' + (r.item.title || 'Bez nazwy') + '”.', 'Cofnij', doUndo); break; }
    case 'add-child': { pushUndo(m, 'dodanie podpunktu'); const c = P(''); r.item.children.push(c); S.expanded.add(c.id); persist('meetings', m.id); render(); $('#f-' + c.id + '-title').focus(); break; }
    case 'add-block': case 'add-divider': { pushUndo(m, 'dodanie'); const b = act === 'add-block' ? B('') : D('Przerywnik'); m.items.push(b); S.expanded.add(b.id); persist('meetings', m.id); render(); const f = $('#f-' + b.id + '-title'); f.focus(); f.select(); break; }
    case 'trash-items': case 'versions': S.sheet = { type: act }; render(); break;
    case 'restore-item': { const k = Number(a.closest('[data-ti]').dataset.ti), t = m.trash[k]; pushUndo(m, 'przywrócenie'); m.trash.splice(k, 1);
      const parent = t.parentId ? m.items.find(b => b.id === t.parentId) : null, list = t.parentId ? (parent ? parent.children : m.items) : m.items;
      list.splice(Math.min(t.index, list.length), 0, t.item); persist('meetings', m.id); S.sheet = null; render(); toast('Przywrócono „' + (t.item.title || 'Bez nazwy') + '”.'); break; }
    case 'restore-version': { const v = m.versions[Number(a.closest('[data-vi]').dataset.vi)]; S.undo.push({ id: m.id, items: clone(m.items), trash: clone(m.trash || []), label: 'przywrócenie wersji' }); m.items = cloneItems(v.items); persist('meetings', m.id); S.sheet = null; render(); toast('Przywrócono wersję z ' + fmtStamp(v.at) + '.', 'Cofnij', doUndo); break; }
    case 'duplicate': { const c = { ...clone(m), id: rid(), title: m.title + ' (kopia)', items: cloneItems(m.items), trash: [], versions: [], actual: null, members: newMembers(m.zjazdId), author: myFirstName(), createdAt: Date.now(), deletedAt: null }; S.meetings[c.id] = c; persist('meetings', c.id); openMeeting(c.id); toast('Utworzono kopię spotkania.'); break; }
    case 'del-meeting': { m.deletedAt = Date.now(); persist('meetings', m.id); S.view = 'home'; render(); toast('Spotkanie przeniesione do kosza.', 'Cofnij', () => { m.deletedAt = null; persist('meetings', m.id); openMeeting(m.id); }); break; }
    case 'stage-link': makeStageLink(m).then(url => { S.sheet = { type: 'link', url }; render(); }).catch(() => toast('Nie udało się utworzyć linku.')); break;
    case 'copy-link': { const u = S.sheet && S.sheet.url; const ta = $('#link-text'); try { navigator.clipboard.writeText(u).then(() => toast('Skopiowano link.'), () => { ta.select(); toast('Zaznaczyłem link, skopiuj go ręcznie.'); }); } catch (err) { ta.select(); toast('Zaznaczyłem link, skopiuj go ręcznie.'); } break; }
    case 'download': save(fileName(m, 'html'), buildStandalone(m), 'Zapisano. Otwórz plik w przeglądarce telefonu, działa bez internetu.'); break;
    case 'download-txt': save(fileName(m, 'txt'), buildText(m), 'Zapisano plik tekstowy.'); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.gq !== undefined) { S.gq = t.value; const box = $('#game-results'); if (box) box.innerHTML = gameResults(!!(S.sheet && S.sheet.type === 'game-pick')); return; }
  if (t.dataset.gf && S.sheet && S.sheet.gid) { const g = S.games[S.sheet.gid], k = t.dataset.gf; if (!g) return; g[k] = k === 'minutes' ? (t.value === '' ? null : Math.max(0, Number(t.value))) : t.value; if (t.tagName === 'TEXTAREA') autosize(t); persist('games', g.id); return; }
  if (t.dataset.af && S.sheet && S.sheet.aid) { const n = S.ann[S.sheet.aid]; if (!n) return; n[t.dataset.af] = t.value; if (t.tagName === 'TEXTAREA') autosize(t); persist('ann', n.id); return; }
  if (t.dataset.q !== undefined) { S.q = t.value; const box = $('#arch-results'); if (box) box.innerHTML = archiveResults(t.dataset.q); return; }
  if (t.tagName === 'TEXTAREA') autosize(t);
  const m = cur();
  if (t.dataset.f && m) {
    const li = t.closest('[data-id]'), r = find(m, li.dataset.id); if (!r) return;
    const k = t.dataset.f;
    r.item[k] = k === 'minutes' ? (t.value === '' ? null : Math.max(0, Number(t.value))) : t.value;
    li.querySelector(':scope > .item-row > .item-head').innerHTML = headInner(r.item, r.parent);
    const tot = $('#m-total'); if (tot) tot.textContent = totalMin(m) + ' min';
    persist('meetings', m.id);
  } else if (t.dataset.mf && m) {
    m[t.dataset.mf] = t.value; persist('meetings', m.id);
  } else if (t.dataset.zf) {
    const z = S.zjazdy[t.closest('[data-zid]').dataset.zid]; z[t.dataset.zf] = t.value; persist('zjazdy', z.id);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ainit && S.sheet && S.sheet.aid) { const n = S.ann[S.sheet.aid]; n.inits = t.checked ? uniq([...(n.inits || []), t.dataset.ainit]) : (n.inits || []).filter(k => k !== t.dataset.ainit); persist('ann', n.id); }
  if (t.dataset.pacc) { const li = t.closest('[data-em]'); if (li) setAccess(li.dataset.em, t.dataset.pacc, t.checked); }
  if (t.dataset.member !== undefined && S.sheet && S.sheet.type === 'members') setMember(S.sheet.kind, S.sheet.oid, t.dataset.member, t.checked);
  if (t.id === 'import-file' && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
});

/* ---------- Przeciąganie ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h || S.view !== 'editor') return;
  const li = h.closest('li.item'), list = li.parentElement;
  e.preventDefault();
  drag = { li, list, id: li.dataset.id, grab: e.clientY - li.getBoundingClientRect().top };
  li.classList.add('dragging'); document.body.classList.add('is-dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const { li, list } = drag, y = e.clientY;
  let target = null;
  for (const sb of list.children) { if (sb === li) continue; const r = sb.getBoundingClientRect(); if (y < r.top + r.height / 2) { target = sb; break; } }
  if (target) { if (li.nextElementSibling !== target) list.insertBefore(li, target); } else if (list.lastElementChild !== li) list.appendChild(li);
  li.style.transform = '';
  const nat = li.getBoundingClientRect().top;
  li.style.transform = `translateY(${y - drag.grab - nat}px)`;
  if (y < 70) window.scrollBy(0, -12); else if (y > window.innerHeight - 70) window.scrollBy(0, 12);
});
function endDrag(){
  if (!drag) return;
  const { li, list, id } = drag; drag = null;
  li.classList.remove('dragging'); li.style.transform = ''; document.body.classList.remove('is-dragging');
  const m = cur(); if (!m) return;
  const order = [...list.children].map(x => x.dataset.id);
  const r = find(m, id); if (!r) return;
  if (order.join(',') === r.list.map(x => x.id).join(',')) return;
  pushUndo(m, 'przesunięcie');
  const byId = Object.fromEntries(r.list.map(x => [x.id, x]));
  const next = order.map(k => byId[k]).filter(Boolean);
  r.list.splice(0, r.list.length, ...next);
  persist('meetings', m.id); render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- Start i logowanie ---------- */
function loadCache(){
  try { const c = JSON.parse(lsGet(cacheKey()) || 'null'); if (c) { S.meetings = c.meetings || {}; S.zjazdy = c.zjazdy || {}; S.games = c.games || {}; S.ann = c.ann || {}; } } catch (e) {}
}
function localMode(){
  S.mode = 'local'; loadCache(); S.loaded = true; setSync('local'); render();
}
async function init(){
  render();
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('lokalnie')) { localMode(); return; }
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
    if (new URLSearchParams(location.search).has('lokalnie')) { localMode(); return; }
    S.mode = 'setup'; $('#app').innerHTML = `<main class="auth"><div class="auth-card"><h1 class="brand">Pulpit MC</h1><p>Aplikacja jest w przygotowaniu. Logowanie ruszy po podłączeniu bazy.</p><a class="btn big" href="scena/">Otwórz stronę sceny</a></div></main>`; return;
  }
  const app = F.initializeApp(FIREBASE_CONFIG);
  AUTH = F.getAuth(app);
  FDB = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const emu = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('emu');
  if (emu) {
    F.connectAuthEmulator(AUTH, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(FDB, '127.0.0.1', 8080);
    window.__mcTestLogin = email => F.signInWithCredential(AUTH, F.GoogleAuthProvider.credential(JSON.stringify({ sub: email, email, email_verified: true })));
  }
  F.getRedirectResult(AUTH).catch(e => toast('Logowanie nie powiodło się (' + (e && e.code || 'błąd') + ').'));
  F.onAuthStateChanged(AUTH, onUser);
}
async function onUser(u){
  if (u && ME && ME.uid === u.uid) return;
  unsubs.splice(0).forEach(f => f());
  S.meetings = {}; S.zjazdy = {}; S.games = {}; S.ann = {}; S.people = {}; S.requests = {}; S.myReq = null; S.access = null; for (const k in SRC) delete SRC[k]; S.loaded = false; S.view = 'home'; S.openId = null; S.sheet = null;
  if (!u) { ME = null; IS_ADMIN = false; S.mode = 'auth'; render(); return; }
  ME = { uid: u.uid, email: String(u.email || '').toLowerCase(), name: u.displayName || '' };
  loadCache();
  S.mode = 'loading'; render();
  const read = async (col, id) => { try { const d = await F.getDoc(F.doc(FDB, col, id)); return d.exists() ? (d.data() || {}) : false; } catch (e) { return e && e.code === 'permission-denied' ? false : null; } };
  const [adm, allow] = await Promise.all([read('admins', ME.email), read('allow', ME.email)]);
  if (!ME || ME.uid !== u.uid) return;
  IS_ADMIN = !!adm;
  if (!IS_ADMIN && allow === false) { S.mode = 'denied'; watchMyRequest(u.uid); render(); return; }
  const accKey = 'mc-access-' + ME.uid;
  if (allow) lsSet(accKey, JSON.stringify(allow));
  try { S.access = allow || JSON.parse(lsGet(accKey) || 'null') || {}; } catch (e) { S.access = {}; }
  S.mode = 'db'; setSync('loading');
  subscribe('meetings'); subscribe('zjazdy'); subscribe('games'); if (canAnn()) subscribe('ann');
  if (IS_ADMIN) { subscribePeople(); subscribeRequests(); }
  render();
}
let loginT = null;
async function login(){
  S.loggingIn = true; S.loginSlow = false; render();
  clearTimeout(loginT); loginT = setTimeout(() => { if (S.mode === 'auth') { S.loginSlow = true; render(); } }, 12000);
  try { await loginInner(); } finally { clearTimeout(loginT); S.loggingIn = false; if (S.mode === 'auth') render(); }
}
async function loginInner(){
  const p = new F.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  try { await F.signInWithPopup(AUTH, p); }
  catch (e) {
    const c = e && e.code;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { await F.signInWithRedirect(AUTH, p); return; }
    if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') toast('Logowanie nie powiodło się (' + (c || 'błąd') + ').');
  }
}
async function logout(){
  unsubs.splice(0).forEach(f => f());
  try { localStorage.removeItem(cacheKey()); } catch (e) {}
  try { await F.signOut(AUTH); } catch (e) {}
  try { await F.terminate(FDB); await F.clearIndexedDbPersistence(FDB); } catch (e) {}
  location.reload();
}
init();
</script>
